name: chez_le_pointage
description: Enterprise QR attendance mobile application.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.0.3
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  local_auth: ^2.2.0
  mobile_scanner: ^5.1.1
