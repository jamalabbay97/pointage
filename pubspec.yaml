name: chez_le_pointage
description: Enterprise QR attendance mobile application.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  firebase_core: ^3.2.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0
  firebase_messaging: ^15.0.3
  flutter_local_notifications: ^17.2.1
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  local_auth: ^2.2.0
  mobile_scanner: ^5.1.1
  geolocator: ^12.0.0
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0
  battery_plus: ^6.0.2
  uuid: ^4.4.2
  intl: ^0.20.2
  crypto: ^3.0.3
  pdf: ^3.11.0
  excel: ^4.0.3
  universal_io: ^2.3.1
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2
  file_picker: ^8.0.0
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  printing: ^5.14.3
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5
  universal_html: ^2.3.0
  client_information: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "icon/android-chrome-512x512.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true